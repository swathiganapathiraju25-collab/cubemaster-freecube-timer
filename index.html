<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CubeMaster Timer</title>
<meta name="description" content="A fast, free speedcubing timer with 3x3 scrambles, solve history, best time, Ao5 and Ao12.">
<style>
:root{
  --bg:#0d1117; --panel:#161c26; --line:#252e3d; --text:#e8edf5; --muted:#8a96a8;
  --idle:#e8edf5; --hold:#ef4444; --ready:#22c55e; --accent:#4f8cff;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.5;-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
/* six cube colours as a thin strip at the very top */
.strip{height:5px;background:linear-gradient(90deg,#fff 0 16.6%,#facc15 0 33.3%,#ef4444 0 50%,#f97316 0 66.6%,#3b82f6 0 83.3%,#22c55e 0)}
header{max-width:1100px;margin:0 auto;padding:18px 20px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:1.25rem;font-weight:800;letter-spacing:-.02em}
.logo span{color:var(--accent)}
.hint{color:var(--muted);font-size:.85rem}
main{max-width:1100px;margin:0 auto;padding:0 20px 40px;display:grid;grid-template-columns:1fr 340px;gap:20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.timer-card{padding:24px 20px 28px;text-align:center;min-height:460px;display:flex;flex-direction:column;justify-content:center;gap:26px;user-select:none}
.scramble{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:clamp(1rem,2.4vw,1.45rem);letter-spacing:.04em;word-spacing:.35em;min-height:3.2em;transition:opacity .25s}
.scramble.fade{opacity:0}
.time{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;
  font-size:clamp(3.6rem,15vw,8.5rem);font-weight:700;letter-spacing:-.03em;line-height:1;
  color:var(--idle);transition:color .15s,transform .15s;
}
.time.hold{color:var(--hold)}
.time.ready{color:var(--ready);transform:scale(1.04)}
.time.running{color:var(--idle)}
.time.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1.08)}100%{transform:scale(1)}}
.status{color:var(--muted);font-size:.9rem;min-height:1.4em}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
button{
  font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--line);background:#1d2533;color:var(--text);
  padding:12px 22px;border-radius:10px;transition:background .15s,transform .1s,border-color .15s;
}
button:hover{background:#263045;border-color:#34415a}
button:active{transform:scale(.97)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.main{background:var(--accent);border-color:var(--accent);color:#fff;min-width:170px;font-size:1.05rem;padding:14px 26px}
button.main:hover{background:#6a9dff}
button.danger:hover{background:#3a1b20;border-color:var(--hold);color:#ffb4b4}
aside{display:flex;flex-direction:column;gap:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stat{padding:16px 10px;text-align:center}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{display:block;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.2rem;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:.8rem}
.stat.best b{color:var(--ready)}
.hist-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.hist-head h2{font-size:1rem}
.hist-head button{padding:6px 12px;font-size:.85rem}
ul{list-style:none;max-height:380px;overflow-y:auto}
li{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);animation:slide .3s ease}
@keyframes slide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
li:last-child{border-bottom:none}
.n{color:var(--muted);font-size:.85rem}
.t{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600;font-variant-numeric:tabular-nums}
.t small{display:block;font-family:system-ui,sans-serif;font-weight:400;color:var(--muted);font-size:.75rem}
li.isbest .t{color:var(--ready)}
.x{background:none;border:none;color:var(--muted);padding:4px 8px;font-size:1.1rem;border-radius:6px}
.x:hover{color:var(--hold);background:none}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:.9rem}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:0 20px 28px}
@media (max-width:860px){
  main{grid-template-columns:1fr}
  .timer-card{min-height:380px}
  ul{max-height:320px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="strip"></div>
<header>
  <div class="logo">Cube<span>Master</span> Timer</div>
  <div class="hint">Hold Space, release when green</div>
</header>

<main>
  <section class="panel timer-card" id="timerCard">
    <div class="scramble" id="scramble" aria-live="polite"></div>
    <div>
      <div class="time" id="time">0.000</div>
      <div class="status" id="status">Press and hold Space to get ready</div>
    </div>
    <div class="btns">
      <button class="main" id="toggle">Start</button>
      <button id="newScramble">New scramble</button>
    </div>
  </section>

  <aside>
    <div class="panel stats">
      <div class="stat best"><b id="best">-</b><small>Best</small></div>
      <div class="stat"><b id="ao5">-</b><small>Ao5</small></div>
      <div class="stat"><b id="ao12">-</b><small>Ao12</small></div>
    </div>
    <div class="panel">
      <div class="hist-head">
        <h2>Solves (<span id="count">0</span>)</h2>
        <button class="danger" id="clear">Delete all</button>
      </div>
      <ul id="list"></ul>
    </div>
  </aside>
</main>
<footer>Your solves are saved in this browser only.</footer>

<script>
(function () {
  "use strict";

  /* ---------- Elements ---------- */
  var timeEl = document.getElementById("time");
  var statusEl = document.getElementById("status");
  var scrambleEl = document.getElementById("scramble");
  var toggleBtn = document.getElementById("toggle");
  var listEl = document.getElementById("list");

  /* ---------- State ---------- */
  var KEY = "cubemaster_solves_v1";
  var solves = load();           // array of {t: milliseconds, d: timestamp, s: scramble}
  var state = "idle";            // idle | hold | ready | running
  var startTime = 0, raf = 0, holdTimer = 0;
  var currentScramble = "";

  /* ---------- Storage ---------- */
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch (e) { return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(solves)); } catch (e) {}
  }

  /* ---------- Formatting ---------- */
  function fmt(ms) {
    if (ms === null || ms === undefined) return "-";
    var s = ms / 1000;
    if (s >= 60) {
      var m = Math.floor(s / 60);
      var r = (s - m * 60).toFixed(3);
      return m + ":" + (r < 10 ? "0" : "") + r;
    }
    return s.toFixed(3);
  }

  /* ---------- Scramble (3x3) ---------- */
  function makeScramble() {
    var faces = ["U", "D", "R", "L", "F", "B"];
    var mods = ["", "'", "2"];
    var axis = { U: 0, D: 0, R: 1, L: 1, F: 2, B: 2 };
    var moves = [], last = "", prev = "";
    while (moves.length < 20) {
      var f = faces[Math.floor(Math.random() * 6)];
      if (f === last) continue;                                   // never repeat the same face
      if (prev && axis[f] === axis[last] && axis[f] === axis[prev]) continue; // avoid U D U style
      moves.push(f + mods[Math.floor(Math.random() * 3)]);
      prev = last; last = f;
    }
    return moves.join(" ");
  }
  function newScramble() {
    scrambleEl.classList.add("fade");
    setTimeout(function () {
      currentScramble = makeScramble();
      scrambleEl.textContent = currentScramble;
      scrambleEl.classList.remove("fade");
    }, 180);
  }

  /* ---------- Timer ---------- */
  function setState(s) {
    state = s;
    timeEl.className = "time" + (s === "idle" ? "" : " " + s);
    toggleBtn.textContent = s === "running" ? "Stop" : "Start";
    if (s === "idle") statusEl.textContent = "Press and hold Space to get ready";
    if (s === "hold") statusEl.textContent = "Keep holding...";
    if (s === "ready") statusEl.textContent = "Release to start!";
    if (s === "running") statusEl.textContent = "Press any key or tap to stop";
  }
  function tick() {
    timeEl.textContent = fmt(performance.now() - startTime);
    raf = requestAnimationFrame(tick);
  }
  function startTimer() {
    startTime = performance.now();
    setState("running");
    raf = requestAnimationFrame(tick);
  }
  function stopTimer() {
    cancelAnimationFrame(raf);
    var elapsed = Math.round(performance.now() - startTime);
    timeEl.textContent = fmt(elapsed);
    setState("idle");
    timeEl.classList.add("pop");
    setTimeout(function () { timeEl.classList.remove("pop"); }, 400);
    solves.push({ t: elapsed, d: Date.now(), s: currentScramble });
    save();
    render();
    newScramble();
  }

  /* ---------- Keyboard: hold Space, release to start ---------- */
  document.addEventListener("keydown", function (e) {
    if (e.code !== "Space" && state !== "running") return;
    if (e.code === "Space") e.preventDefault();
    if (e.repeat) return;
    if (state === "running") { stopTimer(); return; }
    if (state === "idle") {
      setState("hold");
      holdTimer = setTimeout(function () { if (state === "hold") setState("ready"); }, 300);
    }
  });
  document.addEventListener("keyup", function (e) {
    if (e.code !== "Space") return;
    e.preventDefault();
    clearTimeout(holdTimer);
    if (state === "ready") startTimer();
    else if (state === "hold") setState("idle");   // released too early
  });

  /* ---------- Button (mobile) ---------- */
  toggleBtn.addEventListener("click", function () {
    toggleBtn.blur();
    if (state === "running") stopTimer();
    else if (state === "idle") startTimer();
  });
  document.getElementById("newScramble").addEventListener("click", function () {
    if (state === "idle") newScramble();
  });
  // While running, tapping anywhere on the timer card also stops it
  document.getElementById("timerCard").addEventListener("touchstart", function () {
    if (state === "running") stopTimer();
  }, { passive: true });

  /* ---------- Statistics ---------- */
  // Average of N: drop the fastest and slowest, average the rest
  function avg(n) {
    if (solves.length < n) return null;
    var last = solves.slice(-n).map(function (x) { return x.t; }).sort(function (a, b) { return a - b; });
    var mid = last.slice(1, -1);
    var sum = mid.reduce(function (a, b) { return a + b; }, 0);
    return sum / mid.length;
  }

  /* ---------- Render ---------- */
  function render() {
    var best = solves.length ? Math.min.apply(null, solves.map(function (x) { return x.t; })) : null;
    document.getElementById("best").textContent = fmt(best);
    document.getElementById("ao5").textContent = fmt(avg(5));
    document.getElementById("ao12").textContent = fmt(avg(12));
    document.getElementById("count").textContent = solves.length;

    listEl.innerHTML = "";
    if (!solves.length) {
      listEl.innerHTML = '<div class="empty">No solves yet. Do your first solve!</div>';
      return;
    }
    for (var i = solves.length - 1; i >= 0; i--) {
      var s = solves[i];
      var li = document.createElement("li");
      if (s.t === best) li.className = "isbest";
      var date = new Date(s.d).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
      li.innerHTML =
        '<span class="n">#' + (i + 1) + '</span>' +
        '<span class="t">' + fmt(s.t) + '<small>' + date + '</small></span>' +
        '<button class="x" data-i="' + i + '" aria-label="Delete solve ' + (i + 1) + '">&times;</button>';
      listEl.appendChild(li);
    }
  }

  /* ---------- Deleting ---------- */
  listEl.addEventListener("click", function (e) {
    var b = e.target.closest(".x");
    if (!b) return;
    solves.splice(Number(b.getAttribute("data-i")), 1);
    save(); render();
  });
  document.getElementById("clear").addEventListener("click", function () {
    if (!solves.length) return;
    if (confirm("Delete all " + solves.length + " solves? This cannot be undone.")) {
      solves = []; save(); render();
      timeEl.textContent = "0.000";
    }
  });

  /* ---------- Start ---------- */
  currentScramble = makeScramble();
  scrambleEl.textContent = currentScramble;
  render();
})();
</script>
</body>
</html>
